<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromodor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    background: linear-gradient(to bottom, #87CEEB 0%, #E0F0FF 55%, #E8D5A3 55%, #D2B48C 100%);
    border: 4px solid #333;
    border-radius: 8px;
    max-width: 95vw;
    max-height: 90vh;
    image-rendering: pixelated;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<canvas id="c" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND = 340;

const GRAVITY = 0.65;
const JUMP_V = -13.5;
const PLAYER_X = 130;

let state = 'start';
let score = 0;
let highScore = parseInt(localStorage.getItem('chromodorHigh') || '0');
let frame = 0;
let speed = 6;
let bulls = [];
let eagles = [];
let spawnTimer = 0;
let eagleTimer = 220;
let particles = [];
let floatTexts = [];

const player = {
  x: PLAYER_X,
  y: GROUND,
  vy: 0,
  w: 20,
  h: 55,
  grounded: true,
  jumpsLeft: 2,
  spinning: 0, // frames of spin-past animation
  spinAngle: 0
};

function reset() {
  state = 'playing';
  score = 0;
  speed = 6;
  bulls = [];
  eagles = [];
  spawnTimer = 90;
  eagleTimer = 250;
  particles = [];
  floatTexts = [];
  player.y = GROUND;
  player.vy = 0;
  player.grounded = true;
  player.jumpsLeft = 2;
  player.spinning = 0;
  player.spinAngle = 0;
  frame = 0;
}

function tryDodgeOrJump() {
  if (state === 'start' || state === 'over') {
    reset();
    return;
  }

  // Check for tight "right next to bull" dodge opportunity first
  let canDodge = false;
  let targetBull = null;
  for (const b of bulls) {
    if (b.dodged) continue;
    const dist = b.x - player.x;
    // very tight window: bull is right next to the matador
    if (dist > 10 && dist < 85 && player.grounded) {
      canDodge = true;
      targetBull = b;
      break;
    }
  }

  if (canDodge && targetBull) {
    // SPIN PAST - no jump
    targetBull.dodged = true;
    player.spinning = 28;
    player.spinAngle = 0;
    player.vy = 0; // stay grounded / no jump
    score += 100;
    floatTexts.push({
      text: 'Olé! +100',
      x: player.x + 30,
      y: player.y - 80,
      life: 55,
      color: '#FFD700'
    });
    // celebratory particles
    for (let k = 0; k < 14; k++) {
      particles.push({
        x: player.x,
        y: player.y - 40,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 6 - 2,
        life: 30 + Math.random() * 15,
        color: '#C41E3A'
      });
    }
    return;
  }

  // Normal jump / double jump
  if (player.jumpsLeft > 0 && player.spinning <= 0) {
    const isSecond = player.jumpsLeft === 1;
    player.vy = JUMP_V * (isSecond ? 0.88 : 1);
    player.jumpsLeft--;
    player.grounded = false;
    for (let i = 0; i < (isSecond ? 5 : 8); i++) {
      particles.push({
        x: player.x + (Math.random()-0.5)*12,
        y: player.y,
        vx: (Math.random()-0.5)*4,
        vy: -Math.random()*3 - 1,
        life: 20 + Math.random()*15
      });
    }
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    tryDodgeOrJump();
  }
});
canvas.addEventListener('mousedown', tryDodgeOrJump);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  tryDodgeOrJump();
}, {passive: false});

function spawnBull() {
  const size = 36 + Math.random() * 40;
  bulls.push({
    x: W + 80,
    y: GROUND,
    w: size * 1.6,
    h: size,
    speed: speed + Math.random() * 1.8,
    dodged: false
  });
}

function spawnEagle() {
  // Only spawn if no bulls are currently near the right side of the screen
  const bullNearRight = bulls.some(b => b.x > W - 200);
  if (bullNearRight || bulls.length > 1) return; // never with bulls

  eagles.push({
    x: W + 60,
    y: 140 + Math.random() * 90,
    w: 48,
    h: 28,
    speed: speed * 0.9 + Math.random() * 2
  });
}

function update() {
  if (state !== 'playing') return;
  frame++;
  if (frame % 4 === 0) score++;
  speed = 6 + Math.min(score * 0.008, 7);

  // spin animation
  if (player.spinning > 0) {
    player.spinning--;
    player.spinAngle += 0.45;
    player.vy = 0;
    player.y = GROUND; // stay on ground while spinning past
  } else {
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND) {
      player.y = GROUND;
      player.vy = 0;
      player.grounded = true;
      player.jumpsLeft = 2;
    } else {
      player.grounded = false;
    }
  }

  // spawn bulls
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnBull();
    const interval = Math.max(45, 110 - score * 0.2) + Math.random() * 40;
    spawnTimer = interval;
  }

  // spawn eagles only when safe (no bulls near)
  eagleTimer--;
  if (eagleTimer <= 0) {
    spawnEagle();
    eagleTimer = 220 + Math.random() * 160;
  }

  // bulls
  for (let i = bulls.length - 1; i >= 0; i--) {
    const b = bulls[i];
    b.x -= b.speed;
    if (b.x + b.w < -50) {
      bulls.splice(i, 1);
      continue;
    }

    if (player.spinning > 0) continue; // invulnerable while spinning past

    const px = player.x - 8;
    const py = player.y - player.h + 6;
    const pw = 16;
    const ph = player.h - 12;

    const bx = b.x - b.w * 0.38;
    const by = b.y - b.h + 10;
    const bw = b.w * 0.72;
    const bh = b.h * 0.82;

    if (px < bx + bw && px + pw > bx && py < by + bh && py + ph > by) {
      if (!b.dodged) {
        state = 'over';
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('chromodorHigh', highScore);
        }
      }
    }
  }

  // eagles
  for (let i = eagles.length - 1; i >= 0; i--) {
    const e = eagles[i];
    e.x -= e.speed;
    if (e.x + e.w < -30) {
      eagles.splice(i, 1);
      continue;
    }
    if (player.spinning > 0) continue;

    const px = player.x - 8;
    const py = player.y - player.h + 6;
    const pw = 16;
    const ph = player.h - 12;
    const ex = e.x - 10;
    const ey = e.y - 12;
    const ew = e.w + 5;
    const eh = e.h + 8;
    if (px < ex + ew && px + pw > ex && py < ey + eh && py + ph > ey) {
      state = 'over';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('chromodorHigh', highScore);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const t = floatTexts[i];
    t.y -= 1.1;
    t.life--;
    if (t.life <= 0) floatTexts.splice(i, 1);
  }
}

function drawGround() {
  ctx.fillStyle = '#C4A35A';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(W, GROUND);
  ctx.stroke();
  ctx.strokeStyle = '#A08050';
  ctx.lineWidth = 2;
  ctx.setLineDash([18, 22]);
  ctx.lineDashOffset = -(frame * speed * 0.7) % 40;
  ctx.beginPath();
  ctx.moveTo(0, GROUND + 15);
  ctx.lineTo(W, GROUND + 15);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(100,70,40,0.4)';
  for (let i = 0; i < 12; i++) {
    const fx = ((i * 90 - frame * speed * 0.15) % (W + 90)) - 20;
    ctx.fillRect(fx, GROUND - 45, 6, 45);
    ctx.fillRect(fx - 8, GROUND - 45, 22, 4);
  }
}

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, w * 0.55, 7, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMatador() {
  const x = player.x;
  const y = player.y;
  const jumping = !player.grounded;
  const spinning = player.spinning > 0;

  drawShadow(x, GROUND, 40);

  ctx.save();
  if (spinning) {
    // spin around center
    ctx.translate(x, y - 40);
    ctx.rotate(player.spinAngle);
    ctx.translate(-x, -(y - 40));
  }

  // Large red cape
  ctx.fillStyle = '#C41E3A';
  ctx.beginPath();
  const wave = Math.sin(frame * 0.2) * (jumping || spinning ? 12 : 6);
  const raise = spinning ? 15 : 0;
  ctx.moveTo(x + 4, y - 78 - raise);
  ctx.quadraticCurveTo(x - 30 + wave * 0.5, y - 95 - raise, x - 70 + wave, y - 55);
  ctx.quadraticCurveTo(x - 95 + wave * 1.1, y - 10, x - 55 + wave * 0.6, y + 15);
  ctx.quadraticCurveTo(x - 15, y + 5, x + 8, y - 25);
  ctx.lineTo(x + 6, y - 55);
  ctx.quadraticCurveTo(x + 2, y - 70, x + 4, y - 78 - raise);
  ctx.closePath();
  ctx.fill();

  // Body
  ctx.fillStyle = '#0a0a0a';

  const legSwing = (jumping || spinning) ? 0 : Math.sin(frame * 0.38) * 8;
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 28);
  ctx.lineTo(x - 14 - legSwing * 0.7, y);
  ctx.lineTo(x - 4 - legSwing * 0.5, y);
  ctx.lineTo(x + 2, y - 28);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 2, y - 28);
  ctx.lineTo(x + 10 + legSwing, y);
  ctx.lineTo(x + 18 + legSwing * 0.6, y);
  ctx.lineTo(x + 10, y - 28);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x - 11, y - 30);
  ctx.lineTo(x - 13, y - 62);
  ctx.lineTo(x + 12, y - 62);
  ctx.lineTo(x + 11, y - 30);
  ctx.closePath();
  ctx.fill();

  // Raised arm
  ctx.beginPath();
  ctx.moveTo(x + 6, y - 58);
  ctx.lineTo(x + 8, y - 82 - raise);
  ctx.lineTo(x + 18, y - 80 - raise);
  ctx.lineTo(x + 14, y - 55);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + 13, y - 84 - raise, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x - 8, y - 52);
  ctx.lineTo(x - 22, y - 38);
  ctx.lineTo(x - 16, y - 32);
  ctx.lineTo(x - 4, y - 48);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x + 1, y - 72, 11, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(x + 1, y - 84, 15, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 10, y - 86);
  ctx.quadraticCurveTo(x + 1, y - 105, x + 12, y - 86);
  ctx.fill();

  ctx.strokeStyle = '#0a0a0a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 10, y - 35);
  ctx.lineTo(x + 22, y - 18);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + 11, y - 36, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBull(b) {
  const x = b.x;
  const y = b.y;
  const w = b.w;
  const h = b.h;
  const bodyY = y - h * 0.42;
  const phase = frame * 0.35 + x * 0.008;
  drawShadow(x - w * 0.1, GROUND, w * 0.9);

  ctx.fillStyle = '#C41E3A';
  ctx.beginPath();
  ctx.ellipse(x, bodyY, w * 0.48, h * 0.34, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - w * 0.28, bodyY - h * 0.05, w * 0.28, h * 0.28, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - w * 0.52, bodyY - h * 0.08, w * 0.24, h * 0.22, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x - w * 0.68, bodyY - h * 0.02, w * 0.14, h * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - w * 0.48, bodyY - h * 0.22);
  ctx.quadraticCurveTo(x - w * 0.55, bodyY - h * 0.55, x - w * 0.35, bodyY - h * 0.65);
  ctx.quadraticCurveTo(x - w * 0.42, bodyY - h * 0.35, x - w * 0.48, bodyY - h * 0.22);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - w * 0.55, bodyY - h * 0.25);
  ctx.quadraticCurveTo(x - w * 0.72, bodyY - h * 0.6, x - w * 0.58, bodyY - h * 0.7);
  ctx.quadraticCurveTo(x - w * 0.62, bodyY - h * 0.38, x - w * 0.55, bodyY - h * 0.25);
  ctx.fill();
  ctx.fillStyle = '#1a0505';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.58, bodyY - h * 0.12, 3.5, 2.5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#C41E3A';
  ctx.beginPath();
  ctx.arc(x - w * 0.57, bodyY - h * 0.13, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#C41E3A';
  const legSwing = Math.sin(phase) * 12;
  const legSwing2 = Math.sin(phase + Math.PI) * 10;
  ctx.beginPath();
  ctx.moveTo(x - w * 0.25, bodyY + h * 0.15);
  ctx.quadraticCurveTo(x - w * 0.35 + legSwing * 0.3, bodyY + h * 0.35, x - w * 0.4 + legSwing * 0.5, y - 2);
  ctx.lineTo(x - w * 0.28 + legSwing * 0.4, y - 2);
  ctx.quadraticCurveTo(x - w * 0.22, bodyY + h * 0.3, x - w * 0.18, bodyY + h * 0.12);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - w * 0.05, bodyY + h * 0.18);
  ctx.lineTo(x - w * 0.08 + legSwing2 * 0.4, y);
  ctx.lineTo(x + w * 0.05 + legSwing2 * 0.3, y);
  ctx.lineTo(x + w * 0.08, bodyY + h * 0.15);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.15, bodyY + h * 0.2);
  ctx.lineTo(x + w * 0.22 - legSwing * 0.3, y);
  ctx.lineTo(x + w * 0.35 - legSwing * 0.2, y);
  ctx.lineTo(x + w * 0.32, bodyY + h * 0.18);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.35, bodyY + h * 0.15);
  ctx.lineTo(x + w * 0.42 + legSwing2 * 0.25, y);
  ctx.lineTo(x + w * 0.55 + legSwing2 * 0.2, y);
  ctx.lineTo(x + w * 0.48, bodyY + h * 0.12);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + w * 0.42, bodyY - h * 0.05);
  ctx.quadraticCurveTo(x + w * 0.65, bodyY - h * 0.35, x + w * 0.55, bodyY - h * 0.15);
  ctx.quadraticCurveTo(x + w * 0.7, bodyY + h * 0.05, x + w * 0.5, bodyY + h * 0.1);
  ctx.quadraticCurveTo(x + w * 0.48, bodyY, x + w * 0.42, bodyY - h * 0.05);
  ctx.fill();
}

function drawEagle(e) {
  const x = e.x;
  const y = e.y;
  const flap = Math.sin(frame * 0.35 + x * 0.02) * 12;
  ctx.fillStyle = '#3d2b1f';
  ctx.beginPath();
  ctx.ellipse(x - 8, y + flap * 0.3, 22, 8 + Math.abs(flap)*0.3, -0.4 + flap*0.02, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + 18, y - flap * 0.3, 22, 8 + Math.abs(flap)*0.3, 0.4 - flap*0.02, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2a1c14';
  ctx.beginPath();
  ctx.ellipse(x + 5, y, 18, 10, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#f5f5f0';
  ctx.beginPath();
  ctx.arc(x - 12, y - 2, 9, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#e8a020';
  ctx.beginPath();
  ctx.moveTo(x - 20, y - 1);
  ctx.lineTo(x - 28, y + 3);
  ctx.lineTo(x - 18, y + 4);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(x - 14, y - 4, 2, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#3d2b1f';
  ctx.beginPath();
  ctx.moveTo(x + 18, y);
  ctx.lineTo(x + 32, y - 6);
  ctx.lineTo(x + 30, y + 6);
  ctx.fill();
}

function drawUI() {
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 18, 34);
  ctx.textAlign = 'right';
  ctx.fillText('High: ' + highScore, W - 18, 34);

  floatTexts.forEach(t => {
    ctx.globalAlpha = Math.min(1, t.life / 25);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 26px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  });

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Chromodor', W/2, H/2 - 90);
    ctx.font = '18px system-ui';
    ctx.fillText('Space / Click next to a bull = Spin past for Olé! +100',
                 W/2, H/2 - 40);
    ctx.fillText('Double jump available  •  Avoid eagles',
                 W/2, H/2 - 10);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('¡Olé!', W/2, H/2 + 50);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('¡Ay!', W/2, H/2 - 50);
    ctx.font = '26px system-ui';
    ctx.fillText('Score: ' + score, W/2, H/2 + 5);
    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('New High Score!', W/2, H/2 + 45);
    }
    ctx.fillStyle = '#fff';
    ctx.font = '18px system-ui';
    ctx.fillText('Press SPACE / Click to restart', W/2, H/2 + 90);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = p.color || `rgba(160,120,60,${Math.max(0, p.life/35)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 + (25 - p.life)/12, 0, Math.PI * 2);
    ctx.fill();
  });
}

function loop() {
  update();
  ctx.clearRect(0, 0, W, H);
  drawGround();
  bulls.forEach(drawBull);
  eagles.forEach(drawEagle);
  drawMatador();
  drawParticles();
  drawUI();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
