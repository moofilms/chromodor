<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromodor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    background: linear-gradient(to bottom, #87CEEB 0%, #E0F0FF 55%, #E8D5A3 55%, #D2B48C 100%);
    border: 4px solid #333;
    border-radius: 8px;
    max-width: 95vw;
    max-height: 90vh;
    image-rendering: pixelated;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<canvas id="c" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND = 340;

const GRAVITY = 0.65;
const JUMP_V = -13.5;
const PLAYER_X = 130;

let state = 'start';
let score = 0;
let highScore = parseInt(localStorage.getItem('chromodorHigh') || '0');
let frame = 0;
let speed = 6;
let bulls = [];
let eagles = [];
let spawnTimer = 0;
let eagleTimer = 220;
let particles = [];
let floatTexts = [];

const player = {
  x: PLAYER_X,
  y: GROUND,
  vy: 0,
  w: 20,
  h: 50,
  grounded: true,
  jumpsLeft: 2,
  capeSwing: 0,
  spinning: 0
};

function reset() {
  state = 'playing';
  score = 0;
  speed = 6;
  bulls = [];
  eagles = [];
  spawnTimer = 90;
  eagleTimer = 250;
  particles = [];
  floatTexts = [];
  player.y = GROUND;
  player.vy = 0;
  player.grounded = true;
  player.jumpsLeft = 2;
  player.capeSwing = 0;
  player.spinning = 0;
  frame = 0;
}

function tryDodge() {
  for (const b of bulls) {
    if (b.dodged) continue;
    const dx = b.x - player.x;
    if (dx > 25 && dx < 95) {
      b.dodged = true;
      player.spinning = 40;
      player.capeSwing = 45;
      player.vy = 0;
      player.y = GROUND;
      player.grounded = true;
      player.jumpsLeft = 2;
      score += 100;
      floatTexts.push({
        text: 'Olé! +100',
        x: player.x + 40,
        y: player.y - 90,
        life: 70,
        color: '#FFD700'
      });
      for (let k = 0; k < 14; k++) {
        particles.push({
          x: player.x + 10,
          y: player.y - 40,
          vx: (Math.random() - 0.5) * 8,
          vy: (Math.random() - 0.5) * 6 - 2,
          life: 30 + Math.random() * 20
        });
      }
      return true;
    }
  }
  return false;
}

function jump() {
  if (state === 'start' || state === 'over') {
    reset();
    return;
  }
  if (tryDodge()) return;
  if (player.jumpsLeft > 0 && player.spinning <= 0) {
    const isSecond = player.jumpsLeft === 1;
    player.vy = JUMP_V * (isSecond ? 0.88 : 1);
    player.jumpsLeft--;
    player.grounded = false;
    for (let i = 0; i < (isSecond ? 5 : 8); i++) {
      particles.push({
        x: player.x + (Math.random()-0.5)*12,
        y: player.y,
        vx: (Math.random()-0.5)*4,
        vy: -Math.random()*3 - 1,
        life: 20 + Math.random()*15
      });
    }
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  jump();
}, {passive: false});

function spawnBull() {
  const size = 42 + Math.random() * 28;
  bulls.push({
    x: W + 80,
    y: GROUND,
    w: size * 1.5,
    h: size,
    speed: speed + Math.random() * 1.8,
    dodged: false
  });
}

function canSpawnEagle() {
  for (const b of bulls) {
    if (b.x > W * 0.35) return false;
  }
  return true;
}

function spawnEagle() {
  if (!canSpawnEagle()) {
    eagleTimer = 40;
    return;
  }
  eagles.push({
    x: W + 60,
    y: 140 + Math.random() * 90,
    w: 48,
    h: 28,
    speed: speed * 0.9 + Math.random() * 2
  });
}

function update() {
  if (state !== 'playing') return;
  frame++;
  score = Math.floor(frame / 4);
  speed = 6 + Math.min(score * 0.012, 8);

  if (player.spinning > 0) {
    player.spinning--;
    player.vy = 0;
    player.y = GROUND;
    player.grounded = true;
  } else {
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= GROUND) {
      player.y = GROUND;
      player.vy = 0;
      player.grounded = true;
      player.jumpsLeft = 2;
    } else {
      player.grounded = false;
    }
  }
  if (player.capeSwing > 0) player.capeSwing--;

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnBull();
    const interval = Math.max(40, 105 - score * 0.25) + Math.random() * 35;
    spawnTimer = interval;
  }

  eagleTimer--;
  if (eagleTimer <= 0) {
    spawnEagle();
    eagleTimer = 180 + Math.random() * 160 - Math.min(score * 0.3, 50);
  }

  for (let i = bulls.length - 1; i >= 0; i--) {
    const b = bulls[i];
    b.x -= b.speed;
    if (b.x + b.w < -50) {
      bulls.splice(i, 1);
      continue;
    }
    if (player.spinning > 0) continue;
    const px = player.x - 8;
    const py = player.y - player.h + 6;
    const pw = 16;
    const ph = player.h - 12;
    const bx = b.x - b.w * 0.4;
    const by = b.y - b.h + 8;
    const bw = b.w * 0.75;
    const bh = b.h * 0.85;
    if (px < bx + bw && px + pw > bx && py < by + bh && py + ph > by) {
      if (!b.dodged) {
        state = 'over';
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('chromodorHigh', highScore);
        }
      }
    }
  }

  for (let i = eagles.length - 1; i >= 0; i--) {
    const e = eagles[i];
    e.x -= e.speed;
    if (e.x + e.w < -30) {
      eagles.splice(i, 1);
      continue;
    }
    if (player.spinning > 0) continue;
    const px = player.x - 8;
    const py = player.y - player.h + 6;
    const pw = 16;
    const ph = player.h - 12;
    const ex = e.x - 10;
    const ey = e.y - 12;
    const ew = e.w + 5;
    const eh = e.h + 8;
    if (px < ex + ew && px + pw > ex && py < ey + eh && py + ph > ey) {
      state = 'over';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('chromodorHigh', highScore);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.18;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const t = floatTexts[i];
    t.y -= 1.1;
    t.life--;
    if (t.life <= 0) floatTexts.splice(i, 1);
  }
}

function drawGround() {
  ctx.fillStyle = '#C4A35A';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(W, GROUND);
  ctx.stroke();
  ctx.strokeStyle = '#A08050';
  ctx.lineWidth = 2;
  ctx.setLineDash([18, 22]);
  ctx.lineDashOffset = -(frame * speed * 0.7) % 40;
  ctx.beginPath();
  ctx.moveTo(0, GROUND + 15);
  ctx.lineTo(W, GROUND + 15);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(100,70,40,0.4)';
  for (let i = 0; i < 12; i++) {
    const fx = ((i * 90 - frame * speed * 0.15) % (W + 90)) - 20;
    ctx.fillRect(fx, GROUND - 45, 6, 45);
    ctx.fillRect(fx - 8, GROUND - 45, 22, 4);
  }
}

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, w * 0.55, 7, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMatador() {
  const x = player.x;
  const y = player.y;
  const jumping = !player.grounded && player.spinning <= 0;
  const swing = player.capeSwing > 0;
  const spinning = player.spinning > 0;
  drawShadow(x + 5, GROUND, 42);

  ctx.save();
  if (spinning) {
    ctx.translate(x, y - 45);
    ctx.rotate((40 - player.spinning) * 0.32);
    ctx.translate(-x, -(y - 45));
  }

  // ===== RED CAPE (logo style - large curved billow from raised arm) =====
  ctx.fillStyle = '#C41E3A';
  const wave = Math.sin(frame * 0.18) * (jumping ? 8 : 5) + (swing || spinning ? 16 : 0);
  const raise = (swing || spinning) ? 10 : 0;
  ctx.beginPath();
  // Start near raised fist
  ctx.moveTo(x + 6, y - 88 - raise);
  // High left peak of cape
  ctx.bezierCurveTo(
    x - 25 + wave * 0.4, y - 110 - raise,
    x - 80 + wave, y - 70,
    x - 95 + wave * 0.8, y - 20
  );
  // Bottom of cape
  ctx.bezierCurveTo(
    x - 70 + wave * 0.5, y + 15,
    x - 20, y + 8,
    x + 10, y - 20
  );
  // Back up the body side
  ctx.lineTo(x + 8, y - 50);
  ctx.quadraticCurveTo(x + 4, y - 75, x + 6, y - 88 - raise);
  ctx.closePath();
  ctx.fill();

  // ===== BLACK SILHOUETTE BODY =====
  ctx.fillStyle = '#0a0a0a';

  // Legs (subtle run)
  const leg = jumping ? 0 : Math.sin(frame * 0.36) * 7;
  // Left leg
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 32);
  ctx.lineTo(x - 12 - leg * 0.6, y);
  ctx.lineTo(x - 2 - leg * 0.4, y);
  ctx.lineTo(x + 3, y - 32);
  ctx.closePath();
  ctx.fill();
  // Right leg
  ctx.beginPath();
  ctx.moveTo(x + 3, y - 32);
  ctx.lineTo(x + 11 + leg, y);
  ctx.lineTo(x + 20 + leg * 0.5, y);
  ctx.lineTo(x + 12, y - 32);
  ctx.closePath();
  ctx.fill();

  // Torso
  ctx.beginPath();
  ctx.moveTo(x - 10, y - 32);
  ctx.lineTo(x - 12, y - 68);
  ctx.lineTo(x + 14, y - 68);
  ctx.lineTo(x + 12, y - 32);
  ctx.closePath();
  ctx.fill();

  // Raised arm (high, logo style)
  ctx.beginPath();
  ctx.moveTo(x + 8, y - 62);
  ctx.lineTo(x + 10, y - 92 - raise);
  ctx.lineTo(x + 20, y - 90 - raise);
  ctx.lineTo(x + 16, y - 58);
  ctx.closePath();
  ctx.fill();
  // Fist
  ctx.beginPath();
  ctx.arc(x + 15, y - 95 - raise, 7, 0, Math.PI * 2);
  ctx.fill();

  // Other arm (lower, holding cape edge / sword side)
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 58);
  ctx.lineTo(x - 20, y - 42);
  ctx.lineTo(x - 14, y - 36);
  ctx.lineTo(x - 2, y - 54);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.arc(x + 2, y - 78, 12, 0, Math.PI * 2);
  ctx.fill();

  // Montera hat (classic shape)
  ctx.beginPath();
  ctx.ellipse(x + 2, y - 90, 16, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 10, y - 92);
  ctx.quadraticCurveTo(x + 2, y - 112, x + 14, y - 92);
  ctx.fill();

  // Sword at hip
  ctx.strokeStyle = '#0a0a0a';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 12, y - 38);
  ctx.lineTo(x + 24, y - 18);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + 13, y - 39, 3.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBull(b) {
  const x = b.x;
  const y = b.y;
  const w = b.w;
  const h = b.h;
  const bodyY = y - h * 0.4;
  const phase = frame * 0.3 + x * 0.01;
  drawShadow(x - w * 0.05, GROUND, w * 0.85);

  // SOLID BLACK LOGO-STYLE BULL
  ctx.fillStyle = '#0a0a0a';

  // Main muscular body
  ctx.beginPath();
  ctx.ellipse(x + w * 0.05, bodyY, w * 0.42, h * 0.32, 0.05, 0, Math.PI * 2);
  ctx.fill();

  // Powerful shoulder / neck
  ctx.beginPath();
  ctx.ellipse(x - w * 0.22, bodyY - h * 0.08, w * 0.28, h * 0.28, -0.35, 0, Math.PI * 2);
  ctx.fill();

  // Head (aggressive, facing left)
  ctx.beginPath();
  ctx.ellipse(x - w * 0.48, bodyY - h * 0.1, w * 0.22, h * 0.2, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Snout
  ctx.beginPath();
  ctx.ellipse(x - w * 0.65, bodyY - h * 0.02, w * 0.13, h * 0.11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Large curved horns (logo style - upward and outward)
  // Left horn
  ctx.beginPath();
  ctx.moveTo(x - w * 0.42, bodyY - h * 0.25);
  ctx.quadraticCurveTo(x - w * 0.55, bodyY - h * 0.55, x - w * 0.32, bodyY - h * 0.68);
  ctx.quadraticCurveTo(x - w * 0.38, bodyY - h * 0.4, x - w * 0.42, bodyY - h * 0.25);
  ctx.fill();
  // Right horn
  ctx.beginPath();
  ctx.moveTo(x - w * 0.52, bodyY - h * 0.28);
  ctx.quadraticCurveTo(x - w * 0.72, bodyY - h * 0.58, x - w * 0.55, bodyY - h * 0.72);
  ctx.quadraticCurveTo(x - w * 0.6, bodyY - h * 0.4, x - w * 0.52, bodyY - h * 0.28);
  ctx.fill();

  // Eye (angry slit)
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.55, bodyY - h * 0.15, 3, 2, -0.4, 0, Math.PI * 2);
  ctx.fill();

  // Legs - dynamic charging pose
  ctx.fillStyle = '#0a0a0a';
  const legA = Math.sin(phase) * 8;
  const legB = Math.sin(phase + Math.PI) * 7;

  // Front raised leg (logo style)
  ctx.beginPath();
  ctx.moveTo(x - w * 0.2, bodyY + h * 0.12);
  ctx.quadraticCurveTo(x - w * 0.35 + legA * 0.2, bodyY + h * 0.3, x - w * 0.38 + legA * 0.3, y - 3);
  ctx.lineTo(x - w * 0.25 + legA * 0.2, y - 3);
  ctx.quadraticCurveTo(x - w * 0.18, bodyY + h * 0.25, x - w * 0.12, bodyY + h * 0.1);
  ctx.closePath();
  ctx.fill();

  // Other front leg
  ctx.beginPath();
  ctx.moveTo(x - w * 0.02, bodyY + h * 0.15);
  ctx.lineTo(x - w * 0.05 + legB * 0.3, y);
  ctx.lineTo(x + w * 0.08 + legB * 0.2, y);
  ctx.lineTo(x + w * 0.1, bodyY + h * 0.12);
  ctx.closePath();
  ctx.fill();

  // Back legs
  ctx.beginPath();
  ctx.moveTo(x + w * 0.18, bodyY + h * 0.18);
  ctx.lineTo(x + w * 0.25 - legA * 0.25, y);
  ctx.lineTo(x + w * 0.38 - legA * 0.15, y);
  ctx.lineTo(x + w * 0.35, bodyY + h * 0.15);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + w * 0.38, bodyY + h * 0.12);
  ctx.lineTo(x + w * 0.45 + legB * 0.2, y);
  ctx.lineTo(x + w * 0.58 + legB * 0.15, y);
  ctx.lineTo(x + w * 0.52, bodyY + h * 0.1);
  ctx.closePath();
  ctx.fill();

  // Curled tail (logo style)
  ctx.beginPath();
  ctx.moveTo(x + w * 0.4, bodyY - h * 0.05);
  ctx.quadraticCurveTo(x + w * 0.65, bodyY - h * 0.3, x + w * 0.55, bodyY - h * 0.12);
  ctx.quadraticCurveTo(x + w * 0.72, bodyY + h * 0.05, x + w * 0.5, bodyY + h * 0.08);
  ctx.quadraticCurveTo(x + w * 0.48, bodyY, x + w * 0.4, bodyY - h * 0.05);
  ctx.fill();
}

function drawEagle(e) {
  const x = e.x;
  const y = e.y;
  const flap = Math.sin(frame * 0.35 + x * 0.02) * 12;

  ctx.fillStyle = '#3d2b1f';
  ctx.beginPath();
  ctx.ellipse(x - 8, y + flap * 0.3, 22, 8 + Math.abs(flap)*0.3, -0.4 + flap*0.02, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + 18, y - flap * 0.3, 22, 8 + Math.abs(flap)*0.3, 0.4 - flap*0.02, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#2a1c14';
  ctx.beginPath();
  ctx.ellipse(x + 5, y, 18, 10, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#f5f5f0';
  ctx.beginPath();
  ctx.arc(x - 12, y - 2, 9, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#e8a020';
  ctx.beginPath();
  ctx.moveTo(x - 20, y - 1);
  ctx.lineTo(x - 28, y + 3);
  ctx.lineTo(x - 18, y + 4);
  ctx.fill();

  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(x - 14, y - 4, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#3d2b1f';
  ctx.beginPath();
  ctx.moveTo(x + 18, y);
  ctx.lineTo(x + 32, y - 6);
  ctx.lineTo(x + 30, y + 6);
  ctx.fill();
}

function drawUI() {
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 18, 34);
  ctx.textAlign = 'right';
  ctx.fillText('High: ' + highScore, W - 18, 34);

  floatTexts.forEach(t => {
    ctx.globalAlpha = Math.min(1, t.life / 25);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 24px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  });

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Chromodor', W/2, H/2 - 90);
    ctx.font = '18px system-ui';
    ctx.fillText('Matador vs Bulls & Eagles', W/2, H/2 - 45);
    ctx.font = '15px system-ui';
    ctx.fillText('Space / Click = Jump (double jump)', W/2, H/2 - 5);
    ctx.fillText('Press jump when RIGHT NEXT to a bull to SPIN past it', W/2, H/2 + 22);
    ctx.fillText('Get +100 Olé! bonus (risky timing)', W/2, H/2 + 45);
    ctx.fillText('Avoid the flying bald eagles!', W/2, H/2 + 68);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 26px system-ui';
    ctx.fillText('\u00a1Ol\u00e9!', W/2, H/2 + 110);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('\u00a1Ay!', W/2, H/2 - 50);
    ctx.font = '26px system-ui';
    ctx.fillText('Score: ' + score, W/2, H/2 + 5);
    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('New High Score!', W/2, H/2 + 45);
    }
    ctx.fillStyle = '#fff';
    ctx.font = '18px system-ui';
    ctx.fillText('Press SPACE / Click to restart', W/2, H/2 + 90);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = `rgba(160,120,60,${Math.max(0, p.life/35)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 + (30-p.life)/15, 0, Math.PI*2);
    ctx.fill();
  });
}

function loop() {
  update();
  ctx.clearRect(0, 0, W, H);
  drawGround();
  bulls.forEach(drawBull);
  eagles.forEach(drawEagle);
  drawMatador();
  drawParticles();
  drawUI();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
