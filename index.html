<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromodor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    background: linear-gradient(to bottom, #87CEEB 0%, #E0F0FF 55%, #E8D5A3 55%, #D2B48C 100%);
    border: 4px solid #333;
    border-radius: 8px;
    max-width: 95vw;
    max-height: 90vh;
    image-rendering: pixelated;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<canvas id="c" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND = 340;

const GRAVITY = 0.65;
const JUMP_V = -13.5;
const DOUBLE_JUMP_V = -11.5;
const PLAYER_X = 130;

let state = 'start';
let score = 0;
let highScore = parseInt(localStorage.getItem('chromodorHigh') || '0');
let frame = 0;
let speed = 6;
let bulls = [];
let eagles = [];
let spawnTimer = 0;
let eagleTimer = 0;
let particles = [];
let floatingTexts = [];

const player = {
  x: PLAYER_X,
  y: GROUND,
  vy: 0,
  w: 20,
  h: 50,
  grounded: true,
  jumpsLeft: 2,
  dodging: 0 // frames remaining of cape swing
};

function reset() {
  state = 'playing';
  score = 0;
  speed = 6;
  bulls = [];
  eagles = [];
  spawnTimer = 90;
  eagleTimer = 180;
  particles = [];
  floatingTexts = [];
  player.y = GROUND;
  player.vy = 0;
  player.grounded = true;
  player.jumpsLeft = 2;
  player.dodging = 0;
  frame = 0;
}

function jump() {
  if (state === 'start' || state === 'over') {
    reset();
    return;
  }
  if (player.jumpsLeft > 0) {
    player.vy = player.jumpsLeft === 2 ? JUMP_V : DOUBLE_JUMP_V;
    player.jumpsLeft--;
    player.grounded = false;
    // dust
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: player.x + (Math.random()-0.5)*12,
        y: player.y,
        vx: (Math.random()-0.5)*4,
        vy: -Math.random()*3 - 1,
        life: 20 + Math.random()*12
      });
    }
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  jump();
}, {passive: false});

function spawnBull() {
  const size = 36 + Math.random() * 36;
  bulls.push({
    x: W + 80,
    y: GROUND,
    w: size * 1.6,
    h: size,
    speed: speed + Math.random() * 1.8,
    dodged: false
  });
}

function spawnEagle() {
  const yPos = 100 + Math.random() * 90; // mid-air
  eagles.push({
    x: W + 60,
    y: yPos,
    w: 50 + Math.random() * 20,
    h: 28 + Math.random() * 10,
    speed: speed * 0.9 + Math.random() * 2,
    wingPhase: Math.random() * Math.PI * 2
  });
}

function update() {
  if (state !== 'playing') return;
  frame++;
  // base score from survival
  if (frame % 4 === 0) score++;
  speed = 6 + Math.min(score * 0.008, 7);

  // player physics
  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND) {
    player.y = GROUND;
    player.vy = 0;
    player.grounded = true;
    player.jumpsLeft = 2;
  } else {
    player.grounded = false;
  }
  if (player.dodging > 0) player.dodging--;

  // spawn bulls
  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnBull();
    const interval = Math.max(45, 110 - score * 0.2) + Math.random() * 40;
    spawnTimer = interval;
  }

  // spawn eagles (less frequent)
  eagleTimer--;
  if (eagleTimer <= 0) {
    spawnEagle();
    eagleTimer = 200 + Math.random() * 150 - Math.min(score * 0.3, 80);
  }

  // bulls + dodge check
  for (let i = bulls.length - 1; i >= 0; i--) {
    const b = bulls[i];
    b.x -= b.speed;
    if (b.x + b.w < -50) {
      bulls.splice(i, 1);
      continue;
    }

    // hitboxes
    const px = player.x - 8;
    const py = player.y - player.h + 5;
    const pw = 16;
    const ph = player.h - 10;
    const bx = b.x - b.w * 0.4;
    const by = b.y - b.h + 8;
    const bw = b.w * 0.75;
    const bh = b.h * 0.85;

    const colliding = px < bx + bw && px + pw > bx && py < by + bh && py + ph > by;

    // DODGE / OLE mechanic: airborne + very close horizontally but not yet overlapping fatally
    const distX = b.x - player.x;
    const closeEnough = distX > -20 && distX < 70;
    const isAirborne = !player.grounded;
    if (!b.dodged && isAirborne && closeEnough && !colliding && player.y < GROUND - 30) {
      // successful near-miss dodge!
      b.dodged = true;
      player.dodging = 25;
      const bonus = 60 + Math.floor(Math.random() * 40);
      score += bonus;
      floatingTexts.push({
        x: player.x + 20,
        y: player.y - 60,
        text: '¡OLE! +' + bonus,
        life: 50,
        vy: -1.2
      });
      // extra cape particles
      for (let j = 0; j < 10; j++) {
        particles.push({
          x: player.x - 20 + Math.random() * 30,
          y: player.y - 30,
          vx: -2 - Math.random() * 3,
          vy: (Math.random() - 0.5) * 3,
          life: 20 + Math.random() * 15,
          color: '#C41E3A'
        });
      }
    }

    if (colliding) {
      state = 'over';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('chromodorHigh', highScore);
      }
    }
  }

  // eagles
  for (let i = eagles.length - 1; i >= 0; i--) {
    const e = eagles[i];
    e.x -= e.speed;
    e.wingPhase += 0.25;
    if (e.x + e.w < -40) {
      eagles.splice(i, 1);
      continue;
    }
    // collision with eagle
    const px = player.x - 8;
    const py = player.y - player.h + 5;
    const pw = 16;
    const ph = player.h - 10;
    const ex = e.x - e.w * 0.3;
    const ey = e.y - e.h * 0.5;
    const ew = e.w * 0.7;
    const eh = e.h * 0.8;
    if (px < ex + ew && px + pw > ex && py < ey + eh && py + ph > ey) {
      state = 'over';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('chromodorHigh', highScore);
      }
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.15;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy;
    t.life--;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawGround() {
  ctx.fillStyle = '#C4A35A';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(W, GROUND);
  ctx.stroke();
  ctx.strokeStyle = '#A08050';
  ctx.lineWidth = 2;
  ctx.setLineDash([18, 22]);
  ctx.lineDashOffset = -(frame * speed * 0.7) % 40;
  ctx.beginPath();
  ctx.moveTo(0, GROUND + 15);
  ctx.lineTo(W, GROUND + 15);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(100,70,40,0.4)';
  for (let i = 0; i < 12; i++) {
    const fx = ((i * 90 - frame * speed * 0.15) % (W + 90)) - 20;
    ctx.fillRect(fx, GROUND - 45, 6, 45);
    ctx.fillRect(fx - 8, GROUND - 45, 22, 4);
  }
}

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, w * 0.55, 7, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMatador() {
  const x = player.x;
  const y = player.y;
  const jumping = !player.grounded;
  const isDodging = player.dodging > 0;
  drawShadow(x, GROUND, 38);

  // Cape - more dramatic when dodging
  ctx.fillStyle = '#C41E3A';
  ctx.beginPath();
  const wave = Math.sin(frame * 0.22) * (jumping || isDodging ? 16 : 9);
  const capeExtend = isDodging ? 25 : 0;
  ctx.moveTo(x + 8, y - 52);
  ctx.quadraticCurveTo(x - 8 + wave * 0.4 - capeExtend, y - 75, x - 52 + wave - capeExtend, y - 48);
  ctx.quadraticCurveTo(x - 70 + wave * 0.9 - capeExtend * 1.2, y - 12, x - 42 + wave * 0.5 - capeExtend, y + 10);
  ctx.quadraticCurveTo(x - 12, y - 2, x + 12, y - 14);
  ctx.lineTo(x + 10, y - 38);
  ctx.quadraticCurveTo(x + 6, y - 50, x + 8, y - 52);
  ctx.closePath();
  ctx.fill();

  // Legs
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 5.5;
  ctx.lineCap = 'round';
  const legSwing = jumping ? 0 : Math.sin(frame * 0.4) * 11;
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 24);
  ctx.lineTo(x - 14 - legSwing, y);
  ctx.moveTo(x + 7, y - 24);
  ctx.lineTo(x + 15 + legSwing * 0.75, y);
  ctx.stroke();

  // Body
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(x - 12, y - 52);
  ctx.lineTo(x + 13, y - 52);
  ctx.lineTo(x + 12, y - 22);
  ctx.lineTo(x - 10, y - 22);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.arc(x + 2, y - 62, 12, 0, Math.PI * 2);
  ctx.fill();

  // Montera hat
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.ellipse(x + 2, y - 73, 16, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 9, y - 75);
  ctx.quadraticCurveTo(x + 2, y - 96, x + 13, y - 75);
  ctx.fill();

  // Arms - more extended when dodging
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  const armExtend = isDodging ? 12 : 0;
  ctx.beginPath();
  ctx.moveTo(x + 11, y - 48);
  ctx.lineTo(x + 28 + armExtend, y - 34 + Math.sin(frame * 0.18) * 3);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + 28 + armExtend, y - 34, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 7, y - 46);
  ctx.lineTo(x - 18 - armExtend * 0.5, y - 32);
  ctx.stroke();
}

function drawBull(b) {
  const x = b.x;
  const y = b.y;
  const w = b.w;
  const h = b.h;
  const bodyY = y - h * 0.42;
  const phase = frame * 0.35 + x * 0.008;
  drawShadow(x - w * 0.1, GROUND, w * 0.9);

  ctx.fillStyle = '#C41E3A';

  // Main body
  ctx.beginPath();
  ctx.ellipse(x, bodyY, w * 0.48, h * 0.34, 0, 0, Math.PI * 2);
  ctx.fill();

  // Neck / shoulder
  ctx.beginPath();
  ctx.ellipse(x - w * 0.28, bodyY - h * 0.05, w * 0.28, h * 0.28, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.ellipse(x - w * 0.52, bodyY - h * 0.08, w * 0.24, h * 0.22, -0.15, 0, Math.PI * 2);
  ctx.fill();

  // Snout
  ctx.beginPath();
  ctx.ellipse(x - w * 0.68, bodyY - h * 0.02, w * 0.14, h * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Horns
  ctx.beginPath();
  ctx.moveTo(x - w * 0.48, bodyY - h * 0.22);
  ctx.quadraticCurveTo(x - w * 0.55, bodyY - h * 0.55, x - w * 0.35, bodyY - h * 0.65);
  ctx.quadraticCurveTo(x - w * 0.42, bodyY - h * 0.35, x - w * 0.48, bodyY - h * 0.22);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - w * 0.55, bodyY - h * 0.25);
  ctx.quadraticCurveTo(x - w * 0.72, bodyY - h * 0.6, x - w * 0.58, bodyY - h * 0.7);
  ctx.quadraticCurveTo(x - w * 0.62, bodyY - h * 0.38, x - w * 0.55, bodyY - h * 0.25);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#1a0505';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.58, bodyY - h * 0.12, 3.5, 2.5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#C41E3A';
  ctx.beginPath();
  ctx.arc(x - w * 0.57, bodyY - h * 0.13, 1.2, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  ctx.fillStyle = '#C41E3A';
  const legSwing = Math.sin(phase) * 12;
  const legSwing2 = Math.sin(phase + Math.PI) * 10;

  ctx.beginPath();
  ctx.moveTo(x - w * 0.25, bodyY + h * 0.15);
  ctx.quadraticCurveTo(x - w * 0.35 + legSwing * 0.3, bodyY + h * 0.35, x - w * 0.4 + legSwing * 0.5, y - 2);
  ctx.lineTo(x - w * 0.28 + legSwing * 0.4, y - 2);
  ctx.quadraticCurveTo(x - w * 0.22, bodyY + h * 0.3, x - w * 0.18, bodyY + h * 0.12);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x - w * 0.05, bodyY + h * 0.18);
  ctx.lineTo(x - w * 0.08 + legSwing2 * 0.4, y);
  ctx.lineTo(x + w * 0.05 + legSwing2 * 0.3, y);
  ctx.lineTo(x + w * 0.08, bodyY + h * 0.15);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + w * 0.15, bodyY + h * 0.2);
  ctx.lineTo(x + w * 0.22 - legSwing * 0.3, y);
  ctx.lineTo(x + w * 0.35 - legSwing * 0.2, y);
  ctx.lineTo(x + w * 0.32, bodyY + h * 0.18);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + w * 0.35, bodyY + h * 0.15);
  ctx.lineTo(x + w * 0.42 + legSwing2 * 0.25, y);
  ctx.lineTo(x + w * 0.55 + legSwing2 * 0.2, y);
  ctx.lineTo(x + w * 0.48, bodyY + h * 0.12);
  ctx.closePath();
  ctx.fill();

  // Tail
  ctx.beginPath();
  ctx.moveTo(x + w * 0.42, bodyY - h * 0.05);
  ctx.quadraticCurveTo(x + w * 0.65, bodyY - h * 0.35, x + w * 0.55, bodyY - h * 0.15);
  ctx.quadraticCurveTo(x + w * 0.7, bodyY + h * 0.05, x + w * 0.5, bodyY + h * 0.1);
  ctx.quadraticCurveTo(x + w * 0.48, bodyY, x + w * 0.42, bodyY - h * 0.05);
  ctx.fill();
}

function drawEagle(e) {
  const x = e.x;
  const y = e.y;
  const w = e.w;
  const h = e.h;
  const wing = Math.sin(e.wingPhase) * 12;

  // Wings
  ctx.fillStyle = '#4a3728';
  ctx.beginPath();
  // left wing
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x - w * 0.6, y - 15 - wing, x - w * 0.9, y + 5 + wing * 0.3);
  ctx.quadraticCurveTo(x - w * 0.4, y + 8, x, y + 4);
  ctx.fill();
  // right wing
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + w * 0.6, y - 15 - wing, x + w * 0.9, y + 5 + wing * 0.3);
  ctx.quadraticCurveTo(x + w * 0.4, y + 8, x, y + 4);
  ctx.fill();

  // Body
  ctx.fillStyle = '#3a2a1f';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, w * 0.28, h * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // White head (bald eagle)
  ctx.fillStyle = '#f5f0e6';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.22, y - 4, w * 0.16, h * 0.28, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // Beak
  ctx.fillStyle = '#e8a317';
  ctx.beginPath();
  ctx.moveTo(x - w * 0.35, y - 2);
  ctx.lineTo(x - w * 0.48, y + 2);
  ctx.lineTo(x - w * 0.32, y + 4);
  ctx.fill();

  // Eye
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(x - w * 0.28, y - 6, 2, 0, Math.PI * 2);
  ctx.fill();

  // Tail feathers
  ctx.fillStyle = '#4a3728';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.2, y + 4);
  ctx.lineTo(x + w * 0.4, y + 12);
  ctx.lineTo(x + w * 0.15, y + 10);
  ctx.fill();
}

function drawUI() {
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 18, 34);
  ctx.textAlign = 'right';
  ctx.fillText('High: ' + highScore, W - 18, 34);

  // jumps indicator
  if (state === 'playing') {
    ctx.textAlign = 'left';
    ctx.font = '16px system-ui';
    ctx.fillStyle = player.jumpsLeft > 0 ? '#1a1a1a' : '#888';
    ctx.fillText('Jumps: ' + player.jumpsLeft, 18, 58);
  }

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Chromodor', W/2, H/2 - 80);
    ctx.font = '20px system-ui';
    ctx.fillText('Dodge charging bulls & flying eagles!', W/2, H/2 - 35);
    ctx.font = '16px system-ui';
    ctx.fillText('Double jump available  •  Near-miss bulls for ¡OLE! bonus', W/2, H/2);
    ctx.fillText('SPACE / Click / Tap to jump (risky timing = big points)', W/2, H/2 + 30);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 26px system-ui';
    ctx.fillText('¡Olé!', W/2, H/2 + 80);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('¡Ay!', W/2, H/2 - 50);
    ctx.font = '26px system-ui';
    ctx.fillText('Score: ' + score, W/2, H/2 + 5);
    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('New High Score!', W/2, H/2 + 45);
    }
    ctx.fillStyle = '#fff';
    ctx.font = '18px system-ui';
    ctx.fillText('Press SPACE / Click to restart', W/2, H/2 + 90);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = p.color || `rgba(160,120,60,${Math.max(0, p.life/35)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 + (25 - p.life)/12, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawFloatingTexts() {
  floatingTexts.forEach(t => {
    ctx.globalAlpha = Math.min(1, t.life / 20);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 22px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
    ctx.globalAlpha = 1;
  });
}

function loop() {
  update();
  ctx.clearRect(0, 0, W, H);
  drawGround();
  bulls.forEach(drawBull);
  eagles.forEach(drawEagle);
  drawMatador();
  drawParticles();
  drawFloatingTexts();
  drawUI();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
