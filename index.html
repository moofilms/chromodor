<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromodor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }
  canvas {
    background: linear-gradient(to bottom, #87CEEB 0%, #E0F0FF 55%, #E8D5A3 55%, #D2B48C 100%);
    border: 4px solid #333;
    border-radius: 8px;
    max-width: 95vw;
    max-height: 90vh;
    image-rendering: pixelated;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<canvas id="c" width="800" height="400"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const GROUND = 340;

const GRAVITY = 0.65;
const JUMP_V = -13.5;
const PLAYER_X = 130;

let state = 'start';
let score = 0;
let highScore = parseInt(localStorage.getItem('chromodorHigh') || '0');
let frame = 0;
let speed = 6;
let bulls = [];
let spawnTimer = 0;
let particles = [];

const player = {
  x: PLAYER_X,
  y: GROUND,
  vy: 0,
  w: 20,
  h: 50,
  grounded: true
};

function reset() {
  state = 'playing';
  score = 0;
  speed = 6;
  bulls = [];
  spawnTimer = 90;
  particles = [];
  player.y = GROUND;
  player.vy = 0;
  player.grounded = true;
  frame = 0;
}

function jump() {
  if (state === 'start' || state === 'over') {
    reset();
    return;
  }
  if (player.grounded) {
    player.vy = JUMP_V;
    player.grounded = false;
    for (let i = 0; i < 8; i++) {
      particles.push({
        x: player.x + (Math.random()-0.5)*10,
        y: GROUND,
        vx: (Math.random()-0.5)*4,
        vy: -Math.random()*3 - 1,
        life: 25 + Math.random()*15
      });
    }
  }
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    jump();
  }
});
canvas.addEventListener('mousedown', jump);
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  jump();
}, {passive: false});

function spawnBull() {
  const size = 36 + Math.random() * 32;
  bulls.push({
    x: W + 80,
    y: GROUND,
    w: size * 1.6,
    h: size,
    speed: speed + Math.random() * 1.8
  });
}

function update() {
  if (state !== 'playing') return;
  frame++;
  score = Math.floor(frame / 4);
  speed = 6 + Math.min(score * 0.012, 8);

  player.vy += GRAVITY;
  player.y += player.vy;
  if (player.y >= GROUND) {
    player.y = GROUND;
    player.vy = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnBull();
    const interval = Math.max(40, 105 - score * 0.25) + Math.random() * 35;
    spawnTimer = interval;
  }

  for (let i = bulls.length - 1; i >= 0; i--) {
    const b = bulls[i];
    b.x -= b.speed;
    if (b.x + b.w < -40) {
      bulls.splice(i, 1);
      continue;
    }
    const px = player.x - 7;
    const py = player.y - player.h + 5;
    const pw = 14;
    const ph = player.h - 10;
    const bx = b.x - b.w * 0.4;
    const by = b.y - b.h + 5;
    const bw = b.w * 0.7;
    const bh = b.h * 0.85;
    if (px < bx + bw && px + pw > bx && py < by + bh && py + ph > by) {
      state = 'over';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('chromodorHigh', highScore);
      }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.2;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawGround() {
  ctx.fillStyle = '#C4A35A';
  ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = '#8B7355';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GROUND);
  ctx.lineTo(W, GROUND);
  ctx.stroke();
  ctx.strokeStyle = '#A08050';
  ctx.lineWidth = 2;
  ctx.setLineDash([18, 22]);
  ctx.lineDashOffset = -(frame * speed * 0.7) % 40;
  ctx.beginPath();
  ctx.moveTo(0, GROUND + 15);
  ctx.lineTo(W, GROUND + 15);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(100,70,40,0.4)';
  for (let i = 0; i < 12; i++) {
    const fx = ((i * 90 - frame * speed * 0.15) % (W + 90)) - 20;
    ctx.fillRect(fx, GROUND - 45, 6, 45);
    ctx.fillRect(fx - 8, GROUND - 45, 22, 4);
  }
}

function drawShadow(x, y, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(x, y + 2, w * 0.6, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMatador() {
  const x = player.x;
  const y = player.y;
  const jumping = !player.grounded;
  drawShadow(x, GROUND, 38);

  // Large dramatic red cape matching the logo silhouette (big billowing shape)
  ctx.fillStyle = '#C41E3A';
  ctx.beginPath();
  const wave = Math.sin(frame * 0.22) * (jumping ? 14 : 9);
  ctx.moveTo(x + 8, y - 52);
  ctx.quadraticCurveTo(x - 8 + wave * 0.4, y - 75, x - 52 + wave, y - 48);
  ctx.quadraticCurveTo(x - 70 + wave * 0.9, y - 12, x - 42 + wave * 0.5, y + 10);
  ctx.quadraticCurveTo(x - 12, y - 2, x + 12, y - 14);
  ctx.lineTo(x + 10, y - 38);
  ctx.quadraticCurveTo(x + 6, y - 50, x + 8, y - 52);
  ctx.closePath();
  ctx.fill();

  // Legs run cycle
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 5.5;
  ctx.lineCap = 'round';
  const legSwing = jumping ? 0 : Math.sin(frame * 0.4) * 11;
  ctx.beginPath();
  ctx.moveTo(x - 6, y - 24);
  ctx.lineTo(x - 14 - legSwing, y);
  ctx.moveTo(x + 7, y - 24);
  ctx.lineTo(x + 15 + legSwing * 0.75, y);
  ctx.stroke();

  // Body silhouette
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.moveTo(x - 12, y - 52);
  ctx.lineTo(x + 13, y - 52);
  ctx.lineTo(x + 12, y - 22);
  ctx.lineTo(x - 10, y - 22);
  ctx.closePath();
  ctx.fill();

  // Head
  ctx.beginPath();
  ctx.arc(x + 2, y - 62, 12, 0, Math.PI * 2);
  ctx.fill();

  // Montera hat (logo style)
  ctx.fillStyle = '#0a0a0a';
  ctx.beginPath();
  ctx.ellipse(x + 2, y - 73, 16, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - 9, y - 75);
  ctx.quadraticCurveTo(x + 2, y - 96, x + 13, y - 75);
  ctx.fill();

  // Extended arm (dramatic pose holding cape)
  ctx.strokeStyle = '#111';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 11, y - 48);
  ctx.lineTo(x + 28, y - 34 + Math.sin(frame * 0.18) * 3);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x + 28, y - 34, 4.5, 0, Math.PI * 2);
  ctx.fill();
  // Secondary arm
  ctx.beginPath();
  ctx.moveTo(x - 7, y - 46);
  ctx.lineTo(x - 18, y - 32);
  ctx.stroke();
}

function drawBull(b) {
  const x = b.x;
  const y = b.y;
  const w = b.w;
  const h = b.h;
  const bodyY = y - h * 0.42;
  const phase = frame * 0.35 + x * 0.01;

  drawShadow(x, GROUND, w * 0.85);

  // Solid red silhouette matching the logo style
  ctx.fillStyle = '#C41E3A';

  // === Main body (muscular) ===
  ctx.beginPath();
  ctx.ellipse(x + w * 0.05, bodyY, w * 0.48, h * 0.34, 0.1, 0, Math.PI * 2);
  ctx.fill();

  // === Chest / shoulder muscle ===
  ctx.beginPath();
  ctx.ellipse(x - w * 0.15, bodyY - h * 0.05, w * 0.28, h * 0.28, -0.2, 0, Math.PI * 2);
  ctx.fill();

  // === Head (aggressive, facing left) ===
  ctx.beginPath();
  ctx.ellipse(x - w * 0.42, bodyY - h * 0.08, w * 0.24, h * 0.22, -0.25, 0, Math.PI * 2);
  ctx.fill();

  // Snout
  ctx.beginPath();
  ctx.ellipse(x - w * 0.58, bodyY - h * 0.02, w * 0.14, h * 0.12, -0.1, 0, Math.PI * 2);
  ctx.fill();

  // === Large curved horns (logo style) ===
  ctx.beginPath();
  // Left horn (upper)
  ctx.moveTo(x - w * 0.48, bodyY - h * 0.25);
  ctx.quadraticCurveTo(x - w * 0.55, bodyY - h * 0.55, x - w * 0.35, bodyY - h * 0.62);
  ctx.quadraticCurveTo(x - w * 0.42, bodyY - h * 0.4, x - w * 0.48, bodyY - h * 0.25);
  ctx.fill();
  // Right horn
  ctx.beginPath();
  ctx.moveTo(x - w * 0.38, bodyY - h * 0.28);
  ctx.quadraticCurveTo(x - w * 0.32, bodyY - h * 0.58, x - w * 0.12, bodyY - h * 0.55);
  ctx.quadraticCurveTo(x - w * 0.28, bodyY - h * 0.38, x - w * 0.38, bodyY - h * 0.28);
  ctx.fill();

  // === Eye (angry slit) ===
  ctx.fillStyle = '#1a0505';
  ctx.beginPath();
  ctx.ellipse(x - w * 0.48, bodyY - h * 0.12, 3.5, 2, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // === Legs (dynamic pose with slight gallop) ===
  ctx.fillStyle = '#C41E3A';
  const swing = Math.sin(phase) * 6;
  // Front left (raised-ish)
  ctx.beginPath();
  ctx.moveTo(x - w * 0.25, bodyY + h * 0.15);
  ctx.lineTo(x - w * 0.35 + swing * 0.4, y - 2);
  ctx.lineTo(x - w * 0.18 + swing * 0.4, y - 2);
  ctx.closePath();
  ctx.fill();
  // Front right
  ctx.beginPath();
  ctx.moveTo(x - w * 0.05, bodyY + h * 0.18);
  ctx.lineTo(x - w * 0.12 - swing * 0.5, y);
  ctx.lineTo(x + w * 0.05 - swing * 0.5, y);
  ctx.closePath();
  ctx.fill();
  // Back left
  ctx.beginPath();
  ctx.moveTo(x + w * 0.25, bodyY + h * 0.12);
  ctx.lineTo(x + w * 0.18 + swing * 0.3, y);
  ctx.lineTo(x + w * 0.35 + swing * 0.3, y);
  ctx.closePath();
  ctx.fill();
  // Back right
  ctx.beginPath();
  ctx.moveTo(x + w * 0.4, bodyY + h * 0.1);
  ctx.lineTo(x + w * 0.32 - swing * 0.4, y - 1);
  ctx.lineTo(x + w * 0.48 - swing * 0.4, y - 1);
  ctx.closePath();
  ctx.fill();

  // === Tail (curled like logo) ===
  ctx.beginPath();
  ctx.moveTo(x + w * 0.48, bodyY - h * 0.05);
  ctx.quadraticCurveTo(x + w * 0.7, bodyY - h * 0.25, x + w * 0.62, bodyY + h * 0.1);
  ctx.quadraticCurveTo(x + w * 0.55, bodyY - h * 0.05, x + w * 0.48, bodyY - h * 0.05);
  ctx.fill();
}

function drawUI() {
  ctx.fillStyle = '#1a1a1a';
  ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText('Score: ' + score, 18, 34);
  ctx.textAlign = 'right';
  ctx.fillText('High: ' + highScore, W - 18, 34);

  if (state === 'start') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 52px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Chromodor', W/2, H/2 - 55);
    ctx.font = '22px system-ui';
    ctx.fillText('A matador dodging charging bulls', W/2, H/2 - 5);
    ctx.font = '18px system-ui';
    ctx.fillText('Press SPACE / Click / Tap to start & jump', W/2, H/2 + 45);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText('\u00a1Ol\u00e9!', W/2, H/2 + 95);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 46px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('\u00a1Ay!', W/2, H/2 - 50);
    ctx.font = '26px system-ui';
    ctx.fillText('Score: ' + score, W/2, H/2 + 5);
    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText('New High Score!', W/2, H/2 + 45);
    }
    ctx.fillStyle = '#fff';
    ctx.font = '18px system-ui';
    ctx.fillText('Press SPACE / Click to restart', W/2, H/2 + 90);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.fillStyle = `rgba(160,120,60,${Math.max(0, p.life/35)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5 + (30-p.life)/15, 0, Math.PI*2);
    ctx.fill();
  });
}

function loop() {
  update();
  ctx.clearRect(0, 0, W, H);
  drawGround();
  bulls.forEach(drawBull);
  drawMatador();
  drawParticles();
  drawUI();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
